<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Mercadito</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow border-0 w-100" style="max-width: 400px;">

            <div class="card-header bg-dark text-white text-center py-3 border-secondary">
                <i class="bi bi-shop fs-2 d-block mb-1"></i>
                <span class="fs-4 fw-semibold">Mercadito</span>
            </div>

            <div class="card-body p-4">
                <h1 class="h5 text-center mb-4">Iniciar sesión</h1>

                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Usuario o contraseña incorrectos.
                    </div>
                {% endif %}

                {% if next %}
                    <div class="alert alert-warning" role="alert">
                        Debes iniciar sesión para acceder a esa página.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" id="id_username"
                                   class="form-control" autofocus required
                                   value="{{ form.username.value|default:'' }}">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" id="id_password"
                                   class="form-control" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
