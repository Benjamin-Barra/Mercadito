{% extends "base.html" %}

{% block title %} Crear Productos | Mercadito {% endblock %}

{% block content %}

    <section class="crear_productos card shadow-sm">
        <div class="card-body">
            <h1 class="h4 mb-4">{% if object %}Editar producto{% else %}Crear producto{% endif %}</h1>
            <form method="post" class="register-form" 
                onsubmit="this.querySelector('button[type=submit]').disabled = true">
                {% csrf_token %}

                {{ form.as_p }}
                <button type="submit" class="btn btn-success">
                    {% if object %}Editar producto{% else %}Crear producto{% endif %}
                </button>
            </form>
        </div>
    </section>

{% endblock %}
