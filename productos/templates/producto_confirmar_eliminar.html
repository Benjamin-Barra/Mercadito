{% extends "base.html" %}

{% block title %}Eliminar producto | Mercadito{% endblock %}

{% block content %}
<div class="card shadow-sm border-0" style="max-width: 500px;">
    <div class="card-header bg-danger text-white">
        <i class="bi bi-exclamation-triangle me-2"></i>Confirmar eliminación
    </div>
    <div class="card-body">
        <p class="mb-1">¿Seguro que quieres eliminar este producto?</p>
        <p class="fw-semibold fs-5">{{ producto.nombre }}</p>
        <p class="text-muted small mb-0">Esta acción no se puede deshacer.</p>
    </div>
    <div class="card-footer bg-white d-flex gap-2">
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        </form>
        <a href="{% url 'productos:producto_det' producto.pk %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</div>
{% endblock %}
